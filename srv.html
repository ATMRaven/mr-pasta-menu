<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a1911">
  <title>Mr Pasta — Scanner serveur</title>
  <link rel="icon" href="assets/icon-192.png">
  <style>
    :root{--bg:#07120c;--panel:#102018;--panel2:#15291e;--text:#f3eee3;--muted:#9eaaa0;--gold:#e0c27b;--green:#62c875;--red:#e66d6d;--orange:#eba94f;--line:rgba(255,255,255,.11);--shadow:0 24px 60px rgba(0,0,0,.35);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(circle at 20% 0,#173724 0,transparent 34%),var(--bg);color:var(--text);min-height:100vh}button,input{font:inherit}button{color:inherit}.shell{width:min(1120px,calc(100% - 32px));margin:auto}.topbar{height:82px;border-bottom:1px solid var(--line);background:rgba(5,15,9,.74);backdrop-filter:blur(14px);position:sticky;top:0;z-index:10}.topbar .shell{height:100%;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:138px;height:auto}.brand span{padding-left:14px;border-left:1px solid var(--line);color:var(--muted);font-size:.76rem}.live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.73rem}.live i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(98,200,117,.12)}main{padding:48px 0 80px}.intro{display:flex;align-items:end;justify-content:space-between;gap:30px;margin-bottom:32px}.eyebrow{margin:0 0 8px;color:var(--gold);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;font-weight:900}.intro h1{margin:0;font:500 clamp(2rem,5vw,3.7rem)/1 Georgia,serif;letter-spacing:-.04em}.intro p:not(.eyebrow){margin:11px 0 0;color:var(--muted);font-size:.86rem}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{min-height:46px;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-weight:800;font-size:.75rem;cursor:pointer}.btn.primary{background:var(--gold);color:#142018;border-color:var(--gold)}.btn.danger{color:#ff9a9a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}.stat{padding:18px;border:1px solid var(--line);border-radius:17px;background:rgba(16,32,24,.78)}.stat span{display:block;color:var(--muted);font-size:.68rem}.stat strong{display:block;margin-top:4px;font:500 1.65rem Georgia,serif;color:var(--gold)}.orders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.order{padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 10px 30px rgba(0,0,0,.15)}.order.completed{opacity:.68}.order-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:15px;border-bottom:1px solid var(--line)}.table{display:grid;gap:2px}.table small{color:var(--muted);font-size:.65rem}.table strong{font:500 1.4rem Georgia,serif}.badge{padding:6px 10px;border-radius:999px;background:rgba(235,169,79,.12);color:var(--orange);font-size:.62rem;font-weight:900}.completed .badge{background:rgba(98,200,117,.12);color:var(--green)}.items{display:grid;gap:8px;padding:16px 0}.item{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:start;font-size:.78rem}.item b{color:var(--gold)}.item small{color:var(--muted)}.order-foot{padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.order-foot>strong{font:500 1.4rem Georgia,serif;color:var(--gold)}.order-btns{display:flex;gap:7px}.mini{height:34px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);font-size:.65rem;font-weight:800;cursor:pointer}.mini.ok{color:var(--green)}.mini.delete{color:#ff9494}.mismatch{margin:0 0 12px;padding:9px 11px;border:1px solid rgba(230,109,109,.35);border-radius:10px;background:rgba(230,109,109,.08);color:#ffaaaa;font-size:.67rem}.empty{grid-column:1/-1;min-height:280px;display:grid;place-content:center;justify-items:center;border:1px dashed var(--line);border-radius:22px;background:rgba(16,32,24,.5);text-align:center}.empty span{font-size:2rem}.empty h2{margin:15px 0 5px;font:500 1.5rem Georgia,serif}.empty p{margin:0;color:var(--muted);font-size:.76rem}.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:.25s}.modal.open{opacity:1;visibility:visible}.modal-card{width:min(480px,100%);padding:22px;border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:var(--shadow)}.modal-card h2{margin:0 0 14px;font:500 1.6rem Georgia,serif}.scanner{aspect-ratio:4/3;overflow:hidden;border-radius:14px;background:#000;position:relative}.scanner video{width:100%;height:100%;object-fit:cover;display:block}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.toastbox{position:fixed;z-index:50;right:18px;bottom:18px;display:grid;gap:8px}.toast{padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);box-shadow:var(--shadow);font-size:.74rem}.toast.error{background:#5b2024}.toast.warn{background:#5a3e18}.hidden{display:none!important}
    @media(max-width:760px){.topbar{height:70px}.brand img{width:110px}.brand span{display:none}main{padding-top:32px}.intro{align-items:flex-start;flex-direction:column}.intro h1{font-size:2.5rem}.actions{width:100%}.actions .btn{flex:1}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:13px}.stat strong{font-size:1.3rem}.orders{grid-template-columns:1fr}.order-foot{align-items:flex-start;flex-direction:column}.order-btns{width:100%}.mini{flex:1}}
  </style>
</head>
<body>
  <header class="topbar"><div class="shell" style="padding-top: env(safe-area-inset-top, 0px);"><div class="brand"><img src="assets/logo.png" alt="Mr Pasta"><span>Interface serveur</span></div><a href="index.html" class="btn" style="margin-inline-start:auto;text-decoration:none;font-size:0.85rem;padding:0.4rem 0.8rem;background:rgba(255,255,255,0.15);color:#fff;border-radius:8px;display:inline-flex;align-items:center;gap:0.3rem;">🌐 Menu</a><div class="live"><i></i>Prêt à scanner</div></div></header>
  <main class="shell">
    <section class="intro"><div><p class="eyebrow">Gestion locale</p><h1>Commandes scannées</h1><p>Les commandes restent enregistrées uniquement sur cet appareil.</p></div><div class="actions"><button class="btn primary" id="scanBtn">📷 Scanner</button><label class="btn" for="fileInput" style="display:inline-flex;align-items:center">🖼️ Lire une image</label><input id="fileInput" class="hidden" type="file" accept="image/*"><button class="btn danger" id="clearBtn">Vider la liste</button></div></section>
    <section class="stats"><div class="stat"><span>En attente</span><strong id="pendingCount">0</strong></div><div class="stat"><span>Terminées</span><strong id="doneCount">0</strong></div><div class="stat"><span>Total actif</span><strong id="activeTotal">0 DA</strong></div></section>
    <section class="orders" id="orders"></section>
  </main>
  <div class="modal" id="scannerModal" aria-hidden="true"><div class="modal-card"><h2>Scanner le QR client</h2><div class="scanner"><video id="video" playsinline webkit-playsinline muted autoplay></video></div><div class="modal-actions"><button class="btn" id="closeScanner">Fermer</button></div></div></div>
  <div class="toastbox" id="toasts" aria-live="polite"></div>
  <script src="vendor/qr-scanner.umd.min.js"></script>
  <script>
    (()=>{
      'use strict';
      if (window.QrScanner) {
        QrScanner.WORKER_PATH = 'vendor/qr-scanner-worker.min.js';
      }
      const $=s=>document.querySelector(s); const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
      const money=v=>`${Number(v||0).toLocaleString('fr-FR')} DA`;
      let menu=new Map(),orders=load(),scanner=null,mediaStream=null,scanTimer=null;
      function load(){try{const v=JSON.parse(localStorage.getItem('mrp-orders')||'[]');return Array.isArray(v)?v:[]}catch{return[]}}
      function save(){localStorage.setItem('mrp-orders',JSON.stringify(orders));render()}
      function toast(msg,type=''){const n=document.createElement('div');n.className='toast '+type;n.textContent=msg;$('#toasts').append(n);setTimeout(()=>n.remove(),3200)}
      function render(){const sorted=[...orders].sort((a,b)=>a.status===b.status?b.timestamp-a.timestamp:(a.status==='pending'?-1:1));$('#pendingCount').textContent=orders.filter(o=>o.status==='pending').length;$('#doneCount').textContent=orders.filter(o=>o.status==='completed').length;$('#activeTotal').textContent=money(orders.filter(o=>o.status==='pending').reduce((s,o)=>s+o.serverTotal,0));$('#orders').innerHTML=sorted.length?sorted.map(card).join(''):'<div class="empty"><span>▦</span><h2>Aucune commande</h2><p>Scannez le QR affiché sur le téléphone du client.</p></div>'}
      function card(o){const time=new Date(o.timestamp).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});return `<article class="order ${o.status}" data-id="${esc(o.id)}"><div class="order-head"><div class="table"><small>${esc(time)} · #${esc(o.id)}</small><strong>${o.table&&o.table!=='-'?'Table '+esc(o.table):'Sans table'}</strong></div><span class="badge">${o.status==='completed'?'Terminée':'En attente'}</span></div><div class="items">${o.items.map(i=>`<div class="item"><b>${i.quantity}×</b><span>${esc(i.name)}</span><small>${money(i.unit*i.quantity)}</small></div>`).join('')}</div>${o.mismatch?`<p class="mismatch">⚠ Total QR ${money(o.clientTotal)} · Total recalculé ${money(o.serverTotal)}</p>`:''}<div class="order-foot"><strong>${money(o.serverTotal)}</strong><div class="order-btns"><button class="mini ok" data-action="done" ${o.status==='completed'?'disabled':''}>✓ Terminer</button><button class="mini delete" data-action="delete">Supprimer</button></div></div></article>`}
      function decode(data){const parts=String(data).split('|');if(parts[0]==='MP2'&&parts.length===6){const [,id,ts,table,itemStr,total]=parts;return hydrate({id,timestamp:Number(ts)*1000,table,rows:itemStr.split(',').map(row=>{const [itemId,size,qty]=row.split('.');return{itemId:Number(itemId),sizeIndex:size==='n'?null:Number(size),quantity:Number(qty)}}),clientTotal:Number(total)})}if(parts[0]==='MP'&&parts.length===5){const [,id,ts,itemStr,total]=parts;return hydrate({id,timestamp:Number(ts)*1000,table:'-',rows:itemStr.split(',').map(row=>{const [idSize,qty]=row.split(':');const [itemId,size]=idSize.split('_');return{itemId:Number(itemId),sizeIndex:size==null?null:Number(size),quantity:Number(qty)}}),clientTotal:Number(total)})}throw new Error('Format QR non reconnu')}
      function hydrate(raw){if(!raw.id||!Number.isFinite(raw.timestamp)||!raw.rows.length)throw new Error('QR incomplet');let serverTotal=0;const items=raw.rows.map(row=>{const item=menu.get(row.itemId);if(!item||!Number.isInteger(row.quantity)||row.quantity<1||row.quantity>99)throw new Error(`Article invalide (${row.itemId})`);const size=row.sizeIndex!=null?item.sizes?.[row.sizeIndex]:null;if(row.sizeIndex!=null&&!size)throw new Error(`Taille invalide (${item.name})`);const unit=Number(size?.price??item.price);serverTotal+=unit*row.quantity;return{name:item.name+(size?` (${size.name})`:''),quantity:row.quantity,unit}});return{...raw,items,serverTotal,mismatch:serverTotal!==raw.clientTotal,status:'pending'}}
      function process(data){try{const order=decode(data);if(orders.some(o=>o.id===order.id)){toast('Cette commande a déjà été scannée.','warn');return}orders.unshift(order);save();toast(`Commande ${order.table!=='-'?'table '+order.table:''} ajoutée.`);if(order.mismatch)toast('Attention : différence de total.','warn');navigator.vibrate?.([80,50,80])}catch(e){toast(e.message||'QR invalide','error')}}
      
      async function openScanner(){
        if(!window.QrScanner){toast('Module caméra indisponible.','error');return}
        $('#scannerModal').classList.add('open');
        $('#scannerModal').setAttribute('aria-hidden','false');
        
        stopCameraStream();
        const videoEl = $('#video');

        try {
          // Native HTML5 MediaStream initialization
          try {
            mediaStream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: { ideal: 'environment' } },
              audio: false
            });
          } catch (_) {
            mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          }

          videoEl.srcObject = mediaStream;
          videoEl.setAttribute('playsinline', 'true');
          videoEl.setAttribute('autoplay', 'true');
          videoEl.setAttribute('muted', 'true');
          
          await videoEl.play();

          // QrScanner continuous frame decoding
          scanTimer = setInterval(async () => {
            if (!videoEl || videoEl.paused || videoEl.ended || !videoEl.videoWidth) return;
            try {
              const res = await QrScanner.scanImage(videoEl, { returnDetailedScanResult: true });
              if (res && res.data) {
                closeScanner();
                process(res.data);
              }
            } catch (_) {}
          }, 200);

        } catch(e) {
          closeScanner();
          console.error(e);
          toast("Accès caméra impossible: " + (e.message || e),'error');
        }
      }

      function stopCameraStream(){
        if (scanTimer) {
          clearInterval(scanTimer);
          scanTimer = null;
        }
        if (scanner) {
          try { scanner.stop(); scanner.destroy(); } catch (_) {}
          scanner = null;
        }
        if (mediaStream) {
          try {
            mediaStream.getTracks().forEach(track => track.stop());
          } catch (_) {}
          mediaStream = null;
        }
        const videoEl = $('#video');
        if (videoEl) {
          videoEl.srcObject = null;
        }
      }

      function closeScanner(){
        stopCameraStream();
        $('#scannerModal').classList.remove('open');
        $('#scannerModal').setAttribute('aria-hidden','true');
      }

      async function imageScan(file){if(!file)return;try{const result=await QrScanner.scanImage(file,{returnDetailedScanResult:true});process(result.data)}catch{toast('Aucun QR lisible dans cette image.','error')}}
      async function init(){try{let data=null;try{const r=await fetch('/api/menu');if(r.ok)data=await r.json();}catch(_){}if(!data){const r=await fetch('./data/menu.json');data=await r.json();}menu=new Map(data.map(i=>[Number(i.id),i]));render()}catch{toast('Impossible de charger le menu.','error')}$('#scanBtn').onclick=openScanner;$('#closeScanner').onclick=closeScanner;$('#scannerModal').onclick=e=>{if(e.target.id==='scannerModal')closeScanner()};$('#fileInput').onchange=e=>{imageScan(e.target.files?.[0]);e.target.value=''};$('#clearBtn').onclick=()=>{if(orders.length&&confirm('Supprimer toutes les commandes enregistrées ?')){orders=[];save()}};$('#orders').onclick=e=>{const btn=e.target.closest('[data-action]'),card=e.target.closest('[data-id]');if(!btn||!card)return;const id=card.dataset.id;if(btn.dataset.action==='done'){orders=orders.map(o=>o.id===id?{...o,status:'completed'}:o);save()}else if(confirm('Supprimer cette commande ?')){orders=orders.filter(o=>o.id!==id);save()}}
      if(window.Capacitor?.Plugins?.App){window.Capacitor.Plugins.App.addListener('backButton',()=>{const modal=$('#scannerModal');if(modal&&modal.classList.contains('open')){closeScanner();return;}window.location.href='index.html';});}}
      document.addEventListener('DOMContentLoaded',init);
    })();
  </script>
</body>
</html>
